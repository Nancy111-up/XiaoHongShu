[llm]
model = "qwen-plus"
temperature = 0.7
max_tokens = 2048
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

[agent]
search_timeout = 30
max_search_results = 5
max_revision_rounds = 5

[langsmith]
project = "xhs-brand-agent"
enabled = true

[compliance]
sensitive_words = [
    "最",
    "第一",
    "国家级",
    "全网首发",
    "永久有效",
    "根治",
    "立竿见影",
    "100%",
    "绝对",
    "零风险",
]
llm_review_enabled = false

[db]
url = "sqlite+aiosqlite:///./data/xhs_agent.db"
